
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>OOQ | Clubhouse Drawings</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f5f5f5;
    font-family: Corbel, Arial, sans-serif;
    color: #333;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    background: white;
    padding: 12px 20px;
    border-bottom: 1px solid #ddd;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  button {
    border: 1px solid #ddd;
    background: white;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 15px;
  }

  button:hover { background: #eee; }

  #pageContainer {
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    overflow: auto;
  }

  canvas {
    display: block;
    background: white;
    box-shadow: 0 2px 12px #0002;
    max-width: none;
  }

  #status {
    text-align: center;
    padding: 8px;
    font-size: 13px;
  }
</style>
</head>

<body>

<div class="toolbar">
  <strong>Clubhouse | V36</strong>

  <div class="controls">
    <button id="prev">‹</button>
    <span id="pageInfo">1 / —</span>
    <button id="next">›</button>
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
    <button id="fit">Fit</button>
  </div>
</div>

<div id="status">Loading PDF...</div>
<div id="pageContainer">
  <canvas id="pdfCanvas"></canvas>
</div>

<script type="module">
import * as pdfjsLib from
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs";

const pdfURL = "./clubhouse-v36.pdf";

const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");
const container = document.getElementById("pageContainer");
const info = document.getElementById("pageInfo");
const status = document.getElementById("status");

let pdf = null;
let pageNum = 1;
let zoom = 1;
let renderTask = null;
let renderSequence = 0;

async function renderPage() {
  if (!pdf) return;

  const sequence = ++renderSequence;

  if (renderTask) {
    renderTask.cancel();
    try { await renderTask.promise; }
    catch (e) {
      if (e.name !== "RenderingCancelledException")
        console.error(e);
    }
    renderTask = null;
  }

  if (sequence !== renderSequence) return;

  const page = await pdf.getPage(pageNum);
  if (sequence !== renderSequence) return;

  const base = page.getViewport({scale: 1});
  const availableWidth = Math.max(
    100, container.clientWidth - 24
  );
  const scale = availableWidth / base.width * zoom;
  const viewport = page.getViewport({scale});

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(viewport.width * dpr);
  canvas.height = Math.floor(viewport.height * dpr);
  canvas.style.width = viewport.width + "px";
  canvas.style.height = viewport.height + "px";

  renderTask = page.render({
    canvasContext: ctx,
    viewport,
    transform: dpr === 1
      ? null : [dpr, 0, 0, dpr, 0, 0]
  });

  try {
    await renderTask.promise;
  } catch (e) {
    if (e.name !== "RenderingCancelledException")
      throw e;
  }

  if (sequence === renderSequence) {
    info.textContent = `${pageNum} / ${pdf.numPages}`;
    status.textContent = "";
  }
}

document.getElementById("prev").onclick = () => {
  if (pageNum > 1) {
    pageNum--;
    renderPage();
  }
};

document.getElementById("next").onclick = () => {
  if (pdf && pageNum < pdf.numPages) {
    pageNum++;
    renderPage();
  }
};

document.getElementById("zoomIn").onclick = () => {
  zoom *= 1.25;
  renderPage();
};

document.getElementById("zoomOut").onclick = () => {
  zoom /= 1.25;
  renderPage();
};

document.getElementById("fit").onclick = () => {
  zoom = 1;
  renderPage();
};

try {
  pdf = await pdfjsLib.getDocument({
  url: pdfURL
}).promise;
  await renderPage();
} catch (e) {
  status.textContent = "Unable to load PDF: " + e.message;
  console.error(e);
}

window.addEventListener("resize", () => {
  if (pdf) renderPage();
});
</script>

</body>
</html>
