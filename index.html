<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>OOQ | Clubhouse Drawings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background: #ffffff;
      font-family: "Corbel", "Arial", sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: white;
      padding: 12px 20px;
      border-bottom: 1px solid #ddd;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #ddd;
      background: white;
      color: #333;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 15px;
      font-family: "Corbel", "Arial", sans-serif;
    }

    button:hover {
      background: #eee;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #download {
      background: #6FA3A9;
      color: white;
      border: none;
      padding: 8px 14px;
      font-weight: bold;
      border-radius: 4px;
    }

    #download:hover {
      background: #57878D;
    }

    #pageContainer {
      display: flex;
      justify-content: flex-start;
      padding: 5px;
      overflow: auto;
    }

    canvas {
      display: block;
      flex-shrink: 0;
      margin: 0 auto;
      background: white;
      box-shadow: 0 2px 12px #0002;
      max-width: none;
    }

    #status {
      text-align: center;
      padding: 8px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #status:empty {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Toolbar -->

  <div class="toolbar">
    <strong id="viewerTitle">SSA Clubhouse</strong>

    <div class="controls">
      <button id="prev" title="Previous Page" disabled>‹</button>

      <span id="pageInfo">— / —</span>

      <button id="next" title="Next Page" disabled>›</button>

      <button id="zoomOut" title="Zoom Out" disabled>−</button>

      <button id="zoomIn" title="Zoom In" disabled>+</button>

      <button id="fit" title="Fit to Width" disabled>Fit</button>

      <button id="download" title="Download PDF" disabled>
        ↓ Download PDF
      </button>
    </div>
  </div>

  <!-- PDF Display -->

  <div id="status" role="status">Loading PDF viewer...</div>

  <div id="pageContainer">
    <canvas id="pdfCanvas"></canvas>
  </div>

  <script type="module">
    /* PDF version selection */

    // Change this for the latest default version.
    const defaultVersion = "V39";

    const allowedVersions = [
      "V32",
      "V33",
      "V34",
      "V35",
      "V36",
      "V37",
      "V38",
      "V39"
    ];

    const params = new URLSearchParams(window.location.search);

    // Accepts ?version=V39 or ?version=v39.
    const requestedVersion = (
      params.get("version") || defaultVersion
    ).trim().toUpperCase();

    const selectedVersion = allowedVersions.includes(requestedVersion)
      ? requestedVersion
      : defaultVersion;

    // The PDF must be in the same hosted folder as this HTML file.
    const pdfURL = new URL(
      `./${selectedVersion}_Combined.pdf`,
      window.location.href
    ).href;

    /* Elements */

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("pageContainer");
    const info = document.getElementById("pageInfo");
    const status = document.getElementById("status");

    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const zoomOutButton = document.getElementById("zoomOut");
    const zoomInButton = document.getElementById("zoomIn");
    const fitButton = document.getElementById("fit");
    const downloadButton = document.getElementById("download");

    document.getElementById("viewerTitle").textContent =
      `SSA Clubhouse · ${selectedVersion}`;

    /* Viewer variables */

    let pdf = null;
    let pageNum = 1;
    let zoom = 1;
    let renderTask = null;
    let renderSequence = 0;
    let resizeTimer = null;

    /* Update controls */

    function updateControls() {
      const ready = pdf !== null;

      prevButton.disabled = !ready || pageNum <= 1;
      nextButton.disabled = !ready || pageNum >= pdf.numPages;

      zoomOutButton.disabled = !ready || zoom <= 0.25;
      zoomInButton.disabled = !ready || zoom >= 4;
      fitButton.disabled = !ready;
      downloadButton.disabled = !ready;
    }

    /* Render PDF */

    async function renderPage() {
      if (!pdf) return;

      const sequence = ++renderSequence;
      const requestedPage = pageNum;

      // Capture the current task so overlapping requests cannot
      // accidentally clear a newer rendering task.
      const previousTask = renderTask;

      if (previousTask) {
        previousTask.cancel();

        try {
          await previousTask.promise;
        } catch (error) {
          if (error.name !== "RenderingCancelledException") {
            console.error(error);
          }
        }

        if (renderTask === previousTask) {
          renderTask = null;
        }
      }

      if (sequence !== renderSequence) return;

      const page = await pdf.getPage(requestedPage);

      if (sequence !== renderSequence) return;

      const base = page.getViewport({ scale: 1 });
      const styles = window.getComputedStyle(container);

      const availableWidth = Math.max(
        100,
        container.clientWidth
          - parseFloat(styles.paddingLeft)
          - parseFloat(styles.paddingRight)
      );

      const scale = (availableWidth / base.width) * zoom;
      const viewport = page.getViewport({ scale });

      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.ceil(viewport.width * dpr);
      canvas.height = Math.ceil(viewport.height * dpr);

      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      const task = page.render({
        canvasContext: ctx,
        viewport,
        transform: dpr === 1
          ? null
          : [dpr, 0, 0, dpr, 0, 0]
      });

      renderTask = task;

      try {
        await task.promise;
      } catch (error) {
        if (error.name === "RenderingCancelledException") {
          return;
        }

        throw error;
      } finally {
        if (renderTask === task) {
          renderTask = null;
        }
      }

      if (sequence === renderSequence) {
        info.textContent = `${requestedPage} / ${pdf.numPages}`;
        status.textContent = "";
        updateControls();
      }
    }

    function requestRender() {
      renderPage().catch((error) => {
        status.textContent = `Unable to display PDF: ${error.message}`;
        console.error(error);
      });
    }

    /* Previous page */

    prevButton.onclick = () => {
      if (pdf && pageNum > 1) {
        pageNum--;
        updateControls();
        requestRender();
      }
    };

    /* Next page */

    nextButton.onclick = () => {
      if (pdf && pageNum < pdf.numPages) {
        pageNum++;
        updateControls();
        requestRender();
      }
    };

    /* Zoom in */

    zoomInButton.onclick = () => {
      zoom = Math.min(4, zoom * 1.25);
      updateControls();
      requestRender();
    };

    /* Zoom out */

    zoomOutButton.onclick = () => {
      zoom = Math.max(0.25, zoom / 1.25);
      updateControls();
      requestRender();
    };

    /* Fit to width */

    fitButton.onclick = () => {
      zoom = 1;
      container.scrollLeft = 0;
      updateControls();
      requestRender();
    };

    /* Download current PDF */

    downloadButton.onclick = () => {
      const link = document.createElement("a");

      link.href = pdfURL;
      link.download = `${selectedVersion}_Combined.pdf`;

      document.body.appendChild(link);
      link.click();
      link.remove();
    };

    /* Load PDF.js and PDF */

    try {
      const pdfjsLib = await import(
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.mjs"
      );

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.worker.mjs";

      status.textContent = `Loading ${selectedVersion}_Combined.pdf...`;

      pdf = await pdfjsLib.getDocument({
        url: pdfURL
      }).promise;

      updateControls();
      await renderPage();

    } catch (error) {
      status.textContent =
        `Unable to load ${selectedVersion}_Combined.pdf: ${error.message}`;

      console.error("PDF viewer error:", error);
      console.error("PDF URL:", pdfURL);
    }

    /* Responsive resize */

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        if (pdf) requestRender();
      }, 150);
    });
  </script>

</body>
</html>
